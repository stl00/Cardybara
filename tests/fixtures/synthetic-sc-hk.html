<!doctype html><html lang="en"><meta charset="utf-8"><title>Synthetic SC HK page (test only)</title>
<!-- Synthetic test page, served locally by scripts/dev-collector/synthetic-bank.mjs. Structure follows a real page; all names and values are made up. -->
<body><main id="root"></main>
<script>
const root=document.getElementById('root'),p=location.pathname;
function rows(list){return '<table>'+list.map(([l,v])=>'<tr><td></td><td>'+l+'</td><td>'+v+'</td></tr>').join('')+'</table>';}
if(sessionStorage.getItem('synthetic-signed-in')!=='1'){
 root.innerHTML='<h1>Synthetic sign in</h1><form><input type="password" aria-label="Synthetic password" autocomplete="off"><button type="button" id="sign-in">Sign in</button></form>';
 document.getElementById('sign-in').onclick=()=>{sessionStorage.setItem('synthetic-signed-in','1');location.href='/hk/nfs/ibank/landing.htm';};
}else if(/card_details/.test(p)){
 const none=sessionStorage.getItem('synthetic-no-payment')==='1';
 root.innerHTML='<form><select><option>Kakapo, 4000123412344321, HKD</option></select></form>'+rows([['Card Number:','4000123412344321 > View'],['Card Type:','Credit Card Account Synthetic Kakapo Card'],['Current Balance:','HKD 1,234.56 DR'],['Approved Credit Limit:','HKD 10,000.00'],['Available Credit Limit:','HKD 8,765.44'],['Billed Balance:','HKD 321.00 DR'],...(none?[]:[['Minimum Payment Due:','HKD 35.00 DR'],['Payment Due Date:','03/12/2030']])])+'<p>All values on this page are made up for tests, and this padding lets the reader settle.</p>';
}else{root.innerHTML='<table><tr><td>Overview</td><td>Cards</td><td>Payments</td></tr></table><p>You last signed in. This landing page holds no account fields, as on the real site, and this padding lets the reader settle.</p>';}
</script></body></html>
