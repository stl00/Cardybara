<!doctype html><html lang="en-US"><meta charset="utf-8"><title>Synthetic bank page (test only)</title>
<!-- Synthetic test page, served locally by scripts/dev-collector/synthetic-bank.mjs. All values are made up. -->
<body><main id="root"></main>
<script>
const cards=[
 {internal:'100',tail:'1234',name:'Synthetic Rewards',balance:'$1,234.56',available:'$8,765.44',statement:'$321.00',closing:'$400.00',minimum:'$35.00',due:'Dec 19, 2030',points:'12,345'},
 {internal:'200',tail:'5678',name:'Synthetic Cash',balance:'$67.89',available:'$4,932.11',statement:'$0.00',points:'2,468',noPayment:true}
];
const root=document.getElementById('root');
function render(){
 if(sessionStorage.getItem('synthetic-signed-in')!=='1'){
  root.innerHTML='<h1>Synthetic sign in</h1><form><input type="password" aria-label="Synthetic password" autocomplete="off"><button type="button" id="sign-in">Sign in</button></form>';
  document.getElementById('sign-in').onclick=()=>{sessionStorage.setItem('synthetic-signed-in','1');render();};
  return;
 }
 const route=location.hash,detail=route.match(/^#\/dashboard\/summary\/(\d+)\/CARD\/BAC/);
 if(detail){
  const c=cards.find(x=>x.internal===detail[1]);
  root.innerHTML=`<h1>${c.name} (...${c.tail})</h1>${c.noPayment?`<div id="title-focus-target">You don't have a payment due right now.</div>`:''}<div id="currentBalance">${c.balance}</div><div id="remainingStatementBalance-dataItem">Remaining statement balance\n${c.statement}</div>${c.noPayment?'':`<div id="lastStatementBalance-dataItem">Last statement balance\n${c.closing}</div><div id="minimumPaymentDue-dataItem">Minimum payment due\n${c.minimum}</div><div id="nextPaymentDueDate-dataItem">Payment due date\n${c.due}</div>`}<div id="ultimateRewards-dataItem">Ultimate Rewards® points\n${c.points}</div><a href="#/dashboard/overview">Back to accounts</a>`;
  root.querySelectorAll('div').forEach(d=>d.style.whiteSpace='pre-line');
  return;
 }
 if(!/^#\/dashboard\/overview/.test(route)){location.hash='#/dashboard/overview';return;}
 root.innerHTML='<h1>Synthetic accounts</h1><section id="CARD_ACCOUNTS">'+cards.map(c=>`<article><button id="accounts-name-link-button-${c.internal}">${c.name} (...${c.tail})</button><div id="${c.internal}-currentBalance-dataItem">${c.balance}</div><div id="${c.internal}-availableCredit-dataItem">${c.available}</div><div id="${c.internal}-remainingStatementBalance-dataItem">${c.statement}</div>${c.noPayment?'':`<div id="${c.internal}-lastStatementBalance-dataItem">${c.closing}</div><div id="${c.internal}-minimumPaymentDue-dataItem">${c.minimum}</div>`}</article>`).join('')+'</section><p>Synthetic overview padding so the rendered page is long enough to settle for the reader. All values on this page are made up for tests.</p>';
 for(const c of cards)document.getElementById('accounts-name-link-button-'+c.internal).onclick=()=>{location.hash=`#/dashboard/summary/${c.internal}/CARD/BAC`;};
}
addEventListener('hashchange',render);render();
</script></body></html>
