import {capturePage} from './agent-snapshot.js';import {validateModel} from './agent-core.js';

const capture=async()=>{const raw=await capturePage('Amex HK',cards);const s={...raw,bank:'Amex HK',region:'HK',page:raw.pageHref,links:[]};return {raw,validated:validateModel({items:raw.observations,nextLinkId:null},s)};};

 document.querySelector('#statement').hidden=true;document.querySelector('#offers').hidden=false;history.replaceState(null,'','/offers/enrolled');r=await capture();checks.savedOfferPlaceholderImage=r.validated.items.some(i=>i.kind==='offer'&&i.title==='TEST MERCHANT'&&i.status==='added');

 document.querySelector('#result').textContent=JSON.stringify({passed:Object.values(checks).every(Boolean),checks,rejected:r.validated.rejected},null,2);
}catch(e){document.querySelector('#result').textContent=JSON.stringify({error:String(e),checks});}};
