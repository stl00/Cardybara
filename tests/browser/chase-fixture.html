<!doctype html><html><meta charset="utf-8"><title>Chase parser integration checks</title><style>body{font-family:system-ui;padding:24px}pre,div,td{white-space:pre-line}</style><button id="run">Run Chase checks</button><pre id="result">Not run</pre><main id="fixture"></main>
<script src="./reader.js"></script><script type="module">
import {capturePage} from './agent-snapshot.js';import {validateModel} from './agent-core.js';
const cards=[{id:'test-card',bank:'Chase',tail:'1234',currency:'USD'},{id:'other-card',bank:'Chase',tail:'5678',currency:'USD'}],checks={},main=document.querySelector('main');
function heading(title){const host=document.createElement('section');host.attachShadow({mode:'open'}).innerHTML='<span role="heading" aria-level="1">'+title+'</span>';main.prepend(host);}
async function capture(ids=[]){const raw=await capturePage('Chase',cards,ids);if(raw.error)return {raw};return {raw,validated:validateModel({items:raw.observations,nextLinkId:null},{...raw,bank:'Chase',region:'US',page:raw.pageHref,links:[]})};}
document.querySelector('#run').onclick=async()=>{try{
history.replaceState(null,'','#/dashboard/overview');main.innerHTML='<button id="accounts-name-link-button-100">Test Card (...1234)</button><div id="100-currentBalance-dataItem">$123.45</div><div>Ultimate Rewards points 999,999</div><table><tbody><tr><td>10/27/2026</td><td>Checking payment to card 1234</td><td>$999.99</td></tr></tbody></table>';
let r=await capture();checks.overviewNoCheckingLeak=r.validated.items.length===1&&r.validated.items[0].value===123.45&&!JSON.stringify(r.raw.blocks).includes('Checking');checks.aggregateRewardsNotAssigned=!r.validated.items.some(i=>i.kind==='reward');
history.replaceState(null,'','#/dashboard/summary/100/CARD/BAC');main.innerHTML='<div id="currentBalance">$123.45</div><div id="remainingStatementBalance-dataItem">$0.00</div><div id="autoPay-dataItem">Automatic payments\nOn\n|\nDetails</div><div id="nextPaymentDueDate-dataItem">Payment due date\nNov 3, 2026</div><div id="ultimateRewards-dataItem">Ultimate Rewards® points\n35,612\n|Redeem</div><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th></tr></thead><tbody><tr><td>10/18/2026</td><td>TEST REFUND</td><td>Travel</td><td>−$23.74</td></tr></tbody></table>';heading('Test Card (...1234)');r=await capture(['test-card']);checks.shadowHeadingAndAmounts=r.validated.items.some(i=>i.key==='balance'&&i.value===123.45)&&r.validated.items.some(i=>i.key==='statement'&&i.value===0);checks.explicitAutopayAndDue=r.validated.items.some(i=>i.key==='autopay'&&i.status==='on')&&r.validated.items.some(i=>i.key==='due'&&i.date==='2026-11-03');checks.creditAndDate=r.validated.items.some(i=>i.kind==='transaction'&&i.value===-23.74&&i.date==='2026-10-18');checks.wrongCardRejected=(await capture(['other-card'])).raw.error==='document_changed';
history.replaceState(null,'','#/dashboard/merchantOffers/offer-hub');main.innerHTML='<button>Test Card...1234</button><a role="button" id="FIGG:100" aria-label="1 of 2 Test Merchant 5% cash back Add Offer">Offer</a><a role="button" id="FIGG:101" aria-label="2 of 2 Test Video $11 cash back 9 days left Success Added">Offer</a>';let clicked=0;main.querySelectorAll('a').forEach(a=>a.onclick=()=>clicked++);r=await capture(['test-card']);checks.mixedOfferStatuses=r.validated.items.filter(i=>i.kind==='offer').length===2&&r.validated.items.some(i=>i.status==='added')&&r.validated.items.some(i=>i.status==='available');checks.noOfferEnrollment=clicked===0;checks.relativeExpiryNotInvented=r.validated.items.every(i=>i.date==='');
history.replaceState(null,'','#/dashboard/benefits/detail');main.innerHTML='<div>$0/$150</div><div>Good through 12/31/2026</div><a href="#"><p>Test Benefit*</p><p>Activation required</p></a>';heading('Benefits ( ...1234 )');heading('$300 Annual Dining Credit*');r=await capture(['test-card']);checks.currentCreditLimit=r.validated.items.some(i=>i.key==='credit_limit'&&i.value===150)&&!r.validated.items.some(i=>i.value===300);checks.activationNotAssumed=r.validated.items.some(i=>i.key==='entitlement'&&i.status==='requires_activation');
document.querySelector('#result').textContent=JSON.stringify({passed:Object.values(checks).every(Boolean),checks,rejected:r.validated?.rejected},null,2);
}catch(e){document.querySelector('#result').textContent=JSON.stringify({error:String(e),checks});}};
</script></html>
