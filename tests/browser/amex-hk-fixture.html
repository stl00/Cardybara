<!doctype html><html lang="zh-HK"><meta charset="utf-8"><title>Cardybara HK activity synthetic fixture</title><style>body{font-family:system-ui;margin:30px}pre{white-space:pre-wrap}</style><button id="run">Run HK activity check</button><pre id="result">Not run</pre><main><button aria-label="open_title">-12345</button><h1>Activity Vitals</h1><h4>The Platinum Card</h4><h1>••••12345</h1><h4>總結欠</h4><h4>HK$0.00</h4><h2>您在此賬單週期內沒有賬項。</h2><h2>上一個賬單週期</h2><p>9月6日 至 2026年10月5日</p><a href="/activity/statement?end=2026-10-05">查看賬項</a></main><script src="./reader.js"></script><script type="module">
import {capturePage} from './agent-snapshot.js';
document.querySelector('#run').onclick=async()=>{try{history.replaceState(null,'','/activity/recent');const r=await capturePage('Amex HK',[{id:'test-hk',bank:'Amex HK',tail:'12345',currency:'HKD'}]);const checks={selectedCard:r.aliases?.[0]?.cardId==='test-hk',currentPeriodExplicitEmpty:r.empty?.some(e=>e.cardId==='test-hk'&&e.kind==='transaction'),historicalViewLink:r.links?.some(l=>l.label.includes('查看賬項')&&l.href.endsWith('/activity/statement?end=2026-10-05')),noInventedTransactions:!r.observations?.some(i=>i.kind==='transaction')};document.querySelector('#result').textContent=JSON.stringify({passed:Object.values(checks).every(Boolean),checks},null,2);}catch(e){document.querySelector('#result').textContent=JSON.stringify({error:String(e)});}};
</script></html>
