<!doctype html><html lang="zh-HK"><meta charset="utf-8"><title>Cardybara lazy offer acceptance</title><style>body{font:16px system-ui;margin:24px}#offers{display:grid;grid-template-columns:1fr 1fr;gap:20px}[aria-label="offer info"]{height:300px;border:1px solid #ccc;padding:12px}pre{white-space:pre-wrap}</style><button id="run">Test lazy offer collection</button><pre id="result">Not run</pre><main><button aria-label="open_title">-12345</button><div role="radio" aria-checked="true">已儲存至卡中 (8)</div><div id="offers"></div></main><script src="./reader.js"></script><script type="module">
import {capturePage} from './agent-snapshot.js';import {validateModel} from './agent-core.js';import {collectCoverage,offerCoverage} from './coverage.js';
const cards=[{id:'hk-test',bank:'Amex HK',tail:'12345',currency:'HKD'}];let observer;
async function runCase(missing,offscreen=false){
 observer?.disconnect();window.scrollTo(0,0);const root=document.querySelector('#offers');root.replaceChildren();
 for(let i=0;i<8;i++){const r=document.createElement('div');r.setAttribute('role','region');r.setAttribute('aria-label','offer info');r.dataset.index=i;r.innerHTML='<button><img alt="accessibility icon"><p></p><p></p></button><span>已儲存至卡中 ••••12345</span>';if(offscreen){r.style.contentVisibility='auto';const p=r.querySelectorAll('p');p[0].textContent='消費滿HK$100可享HK$10簽賬回贈';p[1].textContent='SYNTHETIC MERCHANT '+i;const secret=document.createElement('p');secret.hidden=true;secret.textContent='PRIVATE_HIDDEN_MARKER';r.append(secret);}root.append(r);}
 observer=new IntersectionObserver(entries=>{for(const e of entries){const i=Number(e.target.dataset.index);if(!e.isIntersecting||missing&&i===7)continue;const p=e.target.querySelectorAll('p');p[0].textContent='消費滿HK$100可享HK$10簽賬回贈';p[1].textContent='SYNTHETIC MERCHANT '+i;}},{rootMargin:'0px'});root.querySelectorAll('[aria-label="offer info"]').forEach(r=>observer.observe(r));
 const raw=await capturePage('Amex HK',cards),snapshot={...raw,bank:'Amex HK',region:'HK',page:raw.pageHref,links:[]},validated=validateModel({items:raw.observations,nextLinkId:null},snapshot),coverage=collectCoverage([{kind:'offer',cardId:'hk-test',view:'available',expected:0,confirmedEmpty:true}],raw.coverage,cards);
 return {hiddenExcluded:!JSON.stringify(raw.blocks).includes('PRIVATE_HIDDEN_MARKER'),containers:root.children.length,read:validated.items.filter(i=>i.kind==='offer').length,rejected:validated.rejected,coverage:offerCoverage(validated.items,coverage,cards)};
}
document.querySelector('#run').onclick=async()=>{try{history.replaceState(null,'','/offers/enrolled');const all=await runCase(false),offscreen=await runCase(false,true),missing=await runCase(true);document.querySelector('#result').textContent=JSON.stringify({passed:all.read===8&&all.coverage.complete&&offscreen.read===8&&offscreen.coverage.complete&&offscreen.hiddenExcluded&&missing.read===7&&!missing.coverage.complete,all,offscreen,missing},null,2);}catch(e){document.querySelector('#result').textContent=JSON.stringify({error:String(e)});}};
</script></html>
