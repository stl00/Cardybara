<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="share.css">
<style>:root{--w:1080px;--h:1440px}
.top{position:absolute;left:80px;right:80px;top:80px}.brand{font-size:32px}.brand small{font-size:16px}
.n{position:absolute;right:80px;top:96px;font-size:28px;color:var(--ink2);font-weight:600}
h1{font-size:80px;line-height:1.18;margin-top:70px}
.box{background:#fff;border:2px solid var(--line);border-radius:28px;padding:40px 44px;margin-top:50px}
.check{font-size:32px;line-height:1.5}.check li+li{margin-top:22px}
.join{background:var(--bg2);border-radius:28px;padding:34px 44px;margin-top:30px;font-size:30px;line-height:1.55}
.join b{color:var(--blue)}
.foot{padding:0 80px 64px;font-size:26px}.capy{position:absolute;right:50px;bottom:120px;width:150px}</style></head><body>
<div class="top"><div class="brand"><img src="../../assets/cardybara.svg" width="64" height="64"><span>卡疲扒拉<small>CARDYBARA</small></span></div>
<h1>钱包数据<br><span class="blue">保存在你的电脑里</span></h1>
<div class="box"><ul class="check">
<li>钱包保存在这台电脑的 Chrome 里，不上传、不同步</li>
<li>银行登录和验证由你本人在官网完成，不读取也不保存密码</li>
<li>只读：不付款、不转账、不兑换积分</li>
<li>用卡助手经 Cardybara 服务交给 AI 回答：收不到卡号、余额或账单，服务不保存对话</li>
<li>没有广告，也没有使用统计</li></ul></div>
<div class="join"><b>怎么加入？</b>现在是朋友内测，邀请制。<br>想试的话，找邀请你的人要安装包和邀请码。</div></div>
<span class="n">4/4</span><img class="capy" src="../../assets/zen.svg">
<div class="foot"><span>Chrome 扩展 · 朋友内测</span><span class="sample">与任何银行无关联</span></div></body></html>
