<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="share.css">
<style>:root{--w:1080px;--h:1080px}
.top{position:absolute;left:72px;right:72px;top:64px}.brand{font-size:30px}.brand small{font-size:15px}
h1{font-size:62px;line-height:1.2;margin-top:40px}
.cols{position:absolute;left:72px;right:72px;top:370px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.f{background:#fff;border:2px solid var(--line);border-radius:22px;padding:24px 26px}
.f b{display:block;font-size:28px;margin-bottom:6px}.f span{font-size:21px;color:var(--ink2);line-height:1.45;display:block}
.win{position:absolute;left:72px;right:72px;top:770px;height:190px;border-radius:20px}
.foot{padding:0 72px 36px;font-size:20px}.pill{font-size:20px;padding:5px 16px 5px 5px;position:absolute;right:72px;top:80px}</style></head><body>
<div class="top"><div class="brand"><img src="../../assets/cardybara.svg" width="58" height="58"><span>卡疲扒拉<small>CARDYBARA</small></span></div>
<h1>你的信用卡管家<br><span class="soft">问一句就知道刷哪张卡</span></h1></div>
<span class="pill"><b>Beta</b>朋友内测</span>
<div class="cols">
<div class="f"><b>🏦 读取银行</b><span>Chase · Amex 美国：余额、账单、还款日、MR / UR 积分</span></div>
<div class="f"><b>🍜 刷哪张卡</b><span>按你的卡和积分估值，给出建议和其他选择</span></div>
<div class="f"><b>🎁 本期福利</b><span>每张卡的 credit 和到期日；可开账单和福利提醒</span></div>
<div class="f"><b>🔒 数据在本机</b><span>钱包不上传、不同步；不读取密码；没有统计</span></div></div>

<div class="foot"><span>Chrome 扩展 · 邀请制 · 找邀请你的人要邀请码</span><span class="sample">示例数据 · 与任何银行无关联</span></div>
<script src="crop.js"></script></body></html>
