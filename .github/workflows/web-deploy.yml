name: Deploy web wallet
# Continuous deployment of the web channel (stl00/Cardybara#373, #393): dist/web to the Cloudflare Pages project
# `cardybara-app`. Pull requests from branches of this repository get a preview; a push to main deploys to
# production only when the build and web test jobs of this same workflow run are green on that commit.
# Never pull_request_target: fork PRs get no deploy (and no secrets). Secrets CLOUDFLARE_API_TOKEN (Pages: Edit
# only) and CLOUDFLARE_ACCOUNT_ID live in the protected `web` environment. Rollback: docs/RELEASE.md.
# The product site is a different workflow and project (site.yml, `cardybara`).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-deploy-${{ github.event_name }}-${{ github.ref }}
  # Previews supersede each other; a production deploy is never cancelled half way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run check:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardybara-web
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
  web-tests:
    name: Web checks and mobile E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:web
  preview:
    name: Deploy PR preview
    # Same-repository branches only; a fork's pull request never reaches the secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: web
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cardybara-web
          path: dist/web
      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes wrangler@4.155.0 pages deploy dist/web --project-name cardybara-app --branch "pr-$PR_NUMBER" --commit-hash "$HEAD_SHA" --commit-dirty=true
      - name: Comment the preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- web-preview -->'
          body="$marker"$'\n'"Web preview for ${HEAD_SHA:0:7}: https://pr-${PR_NUMBER}.cardybara-app.pages.dev"
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body"; else gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body"; fi
  production:
    name: Deploy production
    # Runs only when the build and the web tests of this same commit passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, web-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: web
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cardybara-web
          path: dist/web
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: npx --yes wrangler@4.155.0 pages deploy dist/web --project-name cardybara-app --branch main --commit-hash "$COMMIT_SHA" --commit-dirty=true
