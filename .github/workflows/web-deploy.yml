name: Deploy web wallet
# Continuous deployment of the web channel (stl00/Cardybara#373, #393): dist/web to the Cloudflare Pages project
# `cardybara-app`. Pull requests from branches of this repository get a preview; a push to main deploys to
# production only when the build and web test jobs of this same workflow run are green on that commit.
# Never pull_request_target: fork PRs get no deploy (and no secrets). Secrets CLOUDFLARE_API_TOKEN (Pages: Edit
# only) and CLOUDFLARE_ACCOUNT_ID live in the protected `web` environment. Rollback: docs/RELEASE.md.
# The product site is a different workflow and project (site.yml, `cardybara`).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: web-deploy-${{ github.event_name }}-${{ github.ref }}
  # Previews supersede each other; a production deploy is never cancelled half way.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web
        env:
          # The About view shows this commit. On a pull request GITHUB_SHA is a temporary merge commit, so name the head.
          CARDYBARA_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm run check:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cardybara-web
          path: dist/web/
          if-no-files-found: error
          retention-days: 7
  web-tests:
    name: Web checks and mobile E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:release
      - run: npm run build:web
      - run: npm run test:web
  preview:
    name: Deploy PR preview
    # Same-repository branches only; a fork's pull request never reaches the secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: web
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured in the web environment; skipping deploy. 未配置 secret，跳过。"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.cf.outputs.configured == 'true'
        with:
          name: cardybara-web
          path: dist/web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cf.outputs.configured == 'true'
        with:
          node-version: '22'
      - name: Deploy preview to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx --yes wrangler@4.155.0 pages deploy dist/web --project-name cardybara-app --branch "pr-$PR_NUMBER" --commit-hash "$HEAD_SHA" --commit-dirty=true
      - name: Comment the preview URL
        if: steps.cf.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          marker='<!-- web-preview -->'
          body="$marker"$'\n'"Web preview for ${HEAD_SHA:0:7}: https://pr-${PR_NUMBER}.cardybara-app.pages.dev"
          id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body"; else gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body"; fi
  production:
    name: Deploy production
    # Runs only when the build and the web tests of this same commit passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, web-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: web
    steps:
      - name: Check Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Production deployment requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in the web environment."
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cardybara-web
          path: dist/web
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: npx --yes wrangler@4.155.0 pages deploy dist/web --project-name cardybara-app --branch main --commit-hash "$COMMIT_SHA" --commit-dirty=true
      - name: Verify the production bundle
        shell: bash
        run: |
          module_path() {
            sed -nE 's@.*<script type="module"[^>]* src="(/assets/[A-Za-z0-9._-]+\.js)"[^>]*>.*@\1@p'
          }
          bundle=$(module_path < dist/web/index.html)
          if [ -z "$bundle" ] || [ ! -f "dist/web$bundle" ]; then
            echo "::error::The build is missing its JavaScript entry bundle."
            exit 1
          fi
          expected=$(sha256sum "dist/web$bundle" | cut -d' ' -f1)
          for attempt in {1..12}; do
            query="?deploy-check=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$attempt"
            live_bundle=
            live_hash=
            if live_html=$(curl -fsS --max-time 10 "https://cardybara.dev/$query") &&
               live_bundle=$(module_path <<< "$live_html") && [ "$live_bundle" = "$bundle" ] &&
               live_hash=$(curl -fsS --max-time 10 "https://cardybara.dev$bundle$query" | sha256sum | cut -d' ' -f1) &&
               [ "$live_hash" = "$expected" ]; then
              echo "Verified $bundle on cardybara.dev ($expected)."
              exit 0
            fi
            printf 'Attempt %s: live entry %s; SHA-256 %s\n' "$attempt" "${live_bundle:-unavailable}" "${live_hash:-unavailable}"
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo "::error::cardybara.dev did not serve the built bundle $bundle with SHA-256 $expected."
          exit 1
