name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly on main: the extended E2E set (see the e2e job).
    - cron: '17 19 * * *'
permissions:
  contents: read
concurrency:
  # The event is in the key so a push to main never cancels the nightly run.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:release
      - run: npm run test:collector-chrome
      - name: Check tag matches release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "v"+JSON.parse(require("fs").readFileSync("release.json")).label) process.exit(1)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardybara-extension
          path: release/
          if-no-files-found: error
          retention-days: 14
  e2e:
    name: E2E
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The checkout supplies the test script and the synthetic bank page only; the extension under
      # test is the exact ZIP the verify job uploaded, never rebuilt here. The full history is for the
      # upgrade check, which builds the previous package from its release tag or commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cardybara-extension
          path: package-under-test
      - name: Main path on the packaged extension
        run: node scripts/e2e-extension.mjs package-under-test --out e2e-output/main
      - name: Broken packages must fail
        run: node scripts/e2e-extension.mjs package-under-test --negative-controls --out e2e-output/negative
      - name: Manual cards and corrections on the packaged extension
        run: node scripts/e2e-extension.mjs package-under-test --cards --out e2e-output/cards
      - name: A card that is never saved must fail the cards check
        run: node scripts/e2e-extension.mjs package-under-test --cards --negative-controls --out e2e-output/cards-negative
      # Extended set: nightly, on manual runs and on every release tag (the draft release waits for it).
      - name: Browser restart keeps the records
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --restart --out e2e-output/restart
      - name: Lost records across a restart must fail
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --restart --negative-controls --out e2e-output/restart-negative
      - name: An expired bank session asks for a sign-in again and keeps the records
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --expired-login --out e2e-output/expired-login
      - name: A session that never expired must fail the expired-login check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --expired-login --negative-controls --out e2e-output/expired-login-negative
      - name: A stopped refresh ends cancelled and keeps the records
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --cancel --out e2e-output/cancel
      - name: A stop that is never sent must fail the cancel check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --cancel --negative-controls --out e2e-output/cancel-negative
      - name: The assistant chat answers through a scripted model
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --chat --out e2e-output/chat
      - name: A rejected key or a missing answer must fail the chat check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --chat --negative-controls --out e2e-output/chat-negative
      - name: The assistant chat answers through the hosted gateway with an invite code
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --chat --hosted --out e2e-output/chat-hosted
      - name: A revoked invite code or a code over its cap must fail the hosted chat check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --chat --hosted --negative-controls --out e2e-output/chat-hosted-negative
      - name: Build the previous package
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: scripts/build-previous-package.sh previous-package
      - name: An upgrade from the previous package keeps the records
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --upgrade-from previous-package --out e2e-output/upgrade
      - name: Lost records or a package never replaced must fail the upgrade check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: node scripts/e2e-extension.mjs package-under-test --upgrade-from previous-package --negative-controls --out e2e-output/upgrade-negative
      - name: Upload logs and synthetic-page screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-output
          path: e2e-output/
          if-no-files-found: ignore
          retention-days: 7
  draft-release:
    name: Prepare draft release
    needs: [verify, e2e]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft from verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
        run: |
          gh run download "$RUN" --repo "$REPO" --name cardybara-extension --dir release
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag --draft --prerelease --title "Cardybara $TAG" --notes "Candidate only: real Chrome installation and seven-bank acceptance pending. Start with an empty wallet; no owner backup. Do not publish until exact-artifact acceptance passes. AI requires optional local setup. Not submitted to the Chrome Web Store."
