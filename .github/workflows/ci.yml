name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:release
      - run: npm run test:collector-chrome
      - name: Check tag matches release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if(process.env.GITHUB_REF_NAME !== "v"+JSON.parse(require("fs").readFileSync("release.json")).label) process.exit(1)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardybara-extension
          path: release/
          if-no-files-found: error
          retention-days: 14
  draft-release:
    name: Prepare draft release
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create draft from verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
        run: |
          gh run download "$RUN" --repo "$REPO" --name cardybara-extension --dir release
          gh release create "$TAG" release/* --repo "$REPO" --verify-tag --draft --prerelease --title "Cardybara $TAG" --notes "Candidate only: real Chrome installation and seven-bank acceptance pending. Start with an empty wallet; no owner backup. Do not publish until exact-artifact acceptance passes. AI requires optional local setup. Not submitted to the Chrome Web Store."
