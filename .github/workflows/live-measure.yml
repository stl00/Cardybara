name: Live one-off measurement
# One-off real-model measurements the owner approved, run by hand on main behind the protected `live-evals`
# environment that holds the model key (same gate as live-evals.yml). Never on pull requests, pushes or a schedule.
# Each choice has its own approved spend cap, enforced by the script's --max-usd:
#   judge  – #291, answer judge on dev, held-out and the frozen no-answer set, cap 0.20 USD (owner 2026-11-15)
#   recall – #290, live recall@12 with the production prompt and tools on dev and held-out, cap 0.50 USD (owner 2026-11-15)
# The key goes into a temporary config file under RUNNER_TEMP for the scripts to read; it is never printed.
# Reports hold question ids, counts and tool-call scores on synthetic portfolios; no wallet data, no keys.
on:
  workflow_dispatch:
    inputs:
      measure:
        description: Which approved measurement to run
        type: choice
        options: [judge, recall]
permissions:
  contents: read
concurrency:
  group: live-measure
  cancel-in-progress: false
jobs:
  live-measure:
    name: Live one-off measurement
    if: vars.LIVE_EVALS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: live-evals
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Write the model config
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          umask 077
          printf 'DEEPSEEK_API_KEY=%s\n' "$DEEPSEEK_API_KEY" > "$RUNNER_TEMP/model.env"
      - name: Answer judge (#291, cap 0.20 USD)
        if: inputs.measure == 'judge'
        env:
          CARDYBARA_MODEL_CONFIG: ${{ runner.temp }}/model.env
        run: |
          mkdir -p live-measure
          node scripts/eval-benefit-judge.mjs --max-usd=0.2 --out=live-measure/benefit-judge.json | tee live-measure/summary.txt
      - name: Live recall (#290, cap 0.50 USD)
        if: inputs.measure == 'recall'
        env:
          CARDYBARA_MODEL_CONFIG: ${{ runner.temp }}/model.env
        run: |
          mkdir -p live-measure
          # Without --golden the script runs dev (golden.json) and held-out (holdout.json) under one cap.
          node scripts/eval-benefit-recall-live.mjs --max-usd=0.5 --label=after-145-180 --out=live-measure/recall.json | tee live-measure/summary.txt
      - name: Remove the model config
        if: always()
        run: rm -f "$RUNNER_TEMP/model.env"
      - name: Write the job summary
        if: always()
        run: |
          if [ -f live-measure/summary.txt ]; then { echo '```'; tail -n 60 live-measure/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-measure-${{ inputs.measure }}
          path: live-measure/
          if-no-files-found: ignore
          retention-days: 90
