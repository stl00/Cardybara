name: Live multi-turn eval
# Weekly real-model run of the multi-turn reference eval on the synthetic wallet (#269). It costs money and needs the
# model key, so it never runs on pull requests or pushes: only on the schedule and by hand, on main, behind the
# protected `live-evals` environment that holds the key. It stays off until the repository variable
# LIVE_EVALS_ENABLED is "true" (owner step, see evals/README.md). The spend cap is enforced by the script's --budget-usd.
on:
  schedule:
    # Weekly, Monday. About 4 runs a month at the 0.50 USD cap stay inside the monthly budget with the daily live eval.
    - cron: '17 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-multiturn
  cancel-in-progress: false
jobs:
  live-multiturn:
    name: Live multi-turn eval
    if: vars.LIVE_EVALS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: live-evals
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run the multi-turn dialogues on the real model
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # --public keeps tool names and check outcomes only; the summary has pass rates overall and by reference kind.
          node scripts/eval-multiturn.mjs --live --budget-usd=0.50 --public --out=live-multiturn/report.json --summary=live-multiturn/summary.md
      - name: Write the job summary
        if: always()
        run: |
          if [ -f live-multiturn/summary.md ]; then cat live-multiturn/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-multiturn-report
          path: live-multiturn/
          if-no-files-found: ignore
          retention-days: 90
